<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1090" role="img" aria-label="System architecture: browser talks to a Streamlit frontend, which calls a FastAPI backend, which invokes two LangGraph pipelines — a Supervisor-hub intake graph and a direct-chain report graph ending in a human HITL approval gate before docx/pptx output — both sitting on a shared tool/vector-memory/SQLite foundation.">
  <rect x="0" y="0" width="1300" height="1090" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="650" y="34" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1E293B">Education AI Analyst — System Architecture</text>
  <text x="650" y="54" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748B">How a request moves from the browser to an approved, human-signed-off report</text>

  <!-- User -->
  <rect x="555" y="72" width="190" height="42" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
  <text x="650" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1E293B">User (browser)</text>

  <line x1="650" y1="114" x2="650" y2="147" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="666" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">HTTPS</text>

  <!-- Frontend layer -->
  <rect x="150" y="150" width="1000" height="104" rx="10" fill="#F8FAFC" stroke="#1E293B" stroke-width="1.5"/>
  <text x="172" y="175" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E293B">Streamlit Frontend</text>
  <text x="172" y="191" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B">served at :8501 — 10 pages</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="172" y="204" width="300" height="38" rx="6" fill="#EEF2FF" stroke="#818CF8"/>
    <text x="322" y="219" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">Session &amp; Documents</text>
    <text x="322" y="233" text-anchor="middle" font-size="10" fill="#475569">Home, Dashboard</text>

    <rect x="488" y="204" width="340" height="38" rx="6" fill="#EEF2FF" stroke="#818CF8"/>
    <text x="658" y="219" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">Observability</text>
    <text x="658" y="233" text-anchor="middle" font-size="10" fill="#475569">Trace · Comm Log · Graph · Cost</text>

    <rect x="844" y="204" width="284" height="38" rx="6" fill="#EEF2FF" stroke="#818CF8"/>
    <text x="986" y="219" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">Operations</text>
    <text x="986" y="233" text-anchor="middle" font-size="10" fill="#475569">Logs · Memory · HITL · Report</text>
  </g>

  <line x1="650" y1="254" x2="650" y2="287" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="666" y="275" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">REST · httpx</text>

  <!-- Backend layer -->
  <rect x="150" y="290" width="1000" height="104" rx="10" fill="#F8FAFC" stroke="#1E293B" stroke-width="1.5"/>
  <text x="172" y="315" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E293B">FastAPI Backend</text>
  <text x="172" y="331" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B">served at :8000 — one router per resource</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1E293B">
    <rect x="172" y="344" width="131" height="32" rx="6" fill="#EEF2FF" stroke="#818CF8"/>
    <text x="237" y="364" text-anchor="middle">sessions</text>
    <rect x="309" y="344" width="131" height="32" rx="6" fill="#EEF2FF" stroke="#818CF8"/>
    <text x="374" y="364" text-anchor="middle">documents</text>
    <rect x="446" y="344" width="131" height="32" rx="6" fill="#EEF2FF" stroke="#818CF8"/>
    <text x="511" y="364" text-anchor="middle">report</text>
    <rect x="583" y="344" width="131" height="32" rx="6" fill="#EEF2FF" stroke="#818CF8"/>
    <text x="648" y="364" text-anchor="middle">hitl</text>
    <rect x="720" y="344" width="131" height="32" rx="6" fill="#EEF2FF" stroke="#818CF8"/>
    <text x="785" y="364" text-anchor="middle">memory</text>
    <rect x="857" y="344" width="131" height="32" rx="6" fill="#EEF2FF" stroke="#818CF8"/>
    <text x="922" y="364" text-anchor="middle">social</text>
    <rect x="994" y="344" width="131" height="32" rx="6" fill="#EEF2FF" stroke="#818CF8"/>
    <text x="1059" y="364" text-anchor="middle">observability</text>
  </g>

  <line x1="650" y1="394" x2="650" y2="427" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="666" y="415" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">invokes compiled LangGraph objects</text>

  <!-- Left panel: Intake graph -->
  <rect x="150" y="430" width="470" height="310" rx="12" fill="#FAFAFA" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="172" y="458" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E293B">Intake Graph — Supervisor Hub</text>
  <text x="172" y="474" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748B">graph_builder.py · routes by document type</text>

  <rect x="300" y="496" width="170" height="44" rx="8" fill="#E0E7FF" stroke="#4338CA" stroke-width="1.5"/>
  <text x="385" y="523" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E293B">Supervisor</text>

  <line x1="385" y1="540" x2="240" y2="576" stroke="#4F46E5" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="385" y1="540" x2="386" y2="576" stroke="#4F46E5" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="385" y1="540" x2="532" y2="576" stroke="#4F46E5" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="172" y="576" width="136" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5"/>
    <text x="240" y="597" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1E293B">Document</text>
    <text x="240" y="611" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1E293B">Ingestion</text>
    <text x="240" y="623" text-anchor="middle" font-size="9.5" fill="#64748B">pdf·docx·pptx·xlsx</text>

    <rect x="318" y="576" width="136" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5"/>
    <text x="386" y="601" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1E293B">Vision / OCR</text>
    <text x="386" y="617" text-anchor="middle" font-size="9.5" fill="#64748B">scanned images</text>

    <rect x="464" y="576" width="136" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5"/>
    <text x="532" y="601" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1E293B">Social Intel</text>
    <text x="532" y="617" text-anchor="middle" font-size="9.5" fill="#64748B">CSV import path</text>
  </g>

  <text x="172" y="650" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#64748B">↕ each worker returns control to the Supervisor when done</text>
  <text x="172" y="674" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#9D174D">Vision/OCR also calls → OpenRouter (vision model)</text>
  <text x="172" y="690" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#9D174D">Social Intel can also pull live → Facebook Graph API</text>

  <!-- Right panel: Report chain -->
  <rect x="660" y="430" width="490" height="460" rx="12" fill="#FAFAFA" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="682" y="458" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E293B">Report Graph — Direct Chain</text>
  <text x="682" y="474" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748B">report_graph_builder.py · zero Supervisor node</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="682" y="496" width="430" height="48" rx="8" fill="#EEF2FF" stroke="#4F46E5"/>
    <text x="897" y="516" text-anchor="middle" font-size="12" font-weight="600" fill="#1E293B">Data Analyst</text>
    <text x="897" y="532" text-anchor="middle" font-size="9.5" fill="#9D174D">pandas + optional → Tavily web search</text>

    <line x1="897" y1="544" x2="897" y2="574" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>

    <rect x="682" y="574" width="430" height="48" rx="8" fill="#EEF2FF" stroke="#4F46E5"/>
    <text x="897" y="594" text-anchor="middle" font-size="12" font-weight="600" fill="#1E293B">Knowledge / RAG</text>
    <text x="897" y="610" text-anchor="middle" font-size="9.5" fill="#64748B">Chroma vector retrieval</text>

    <line x1="897" y1="622" x2="897" y2="652" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>

    <rect x="682" y="652" width="430" height="48" rx="8" fill="#EEF2FF" stroke="#4F46E5"/>
    <text x="897" y="672" text-anchor="middle" font-size="12" font-weight="600" fill="#1E293B">Report Generator</text>
    <text x="897" y="688" text-anchor="middle" font-size="9.5" fill="#64748B">DOCX + PPTX, with citations</text>

    <line x1="897" y1="700" x2="897" y2="730" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>

    <rect x="682" y="730" width="430" height="48" rx="8" fill="#EEF2FF" stroke="#4F46E5"/>
    <text x="897" y="750" text-anchor="middle" font-size="12" font-weight="600" fill="#1E293B">QA / Critic</text>
    <text x="897" y="766" text-anchor="middle" font-size="9.5" fill="#9D174D">LLM fact-check vs citations → OpenRouter</text>

    <line x1="897" y1="778" x2="897" y2="806" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
    <text x="912" y="796" font-size="10" fill="#475569">on PASS</text>

    <rect x="682" y="806" width="430" height="56" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="897" y="829" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1E293B">HITL Approval</text>
    <text x="897" y="845" text-anchor="middle" font-size="9.5" fill="#92400E">interrupt() — pauses here for a human to approve / reject / retry</text>
  </g>

  <!-- Feedback loop: reject -> retry -->
  <path d="M 682 838 L 638 838 L 638 676 L 682 676" fill="none" stroke="#B45309" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowAmber)"/>
  <text x="628" y="760" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#B45309" transform="rotate(-90 628 760)">reject / retry</text>

  <!-- Final outputs -->
  <line x1="897" y1="862" x2="789" y2="918" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="897" y1="862" x2="1005" y2="918" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="897" y="900" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">on approve</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="682" y="920" width="195" height="44" rx="8" fill="#F1F5F9" stroke="#1E293B" stroke-width="1.3"/>
    <text x="779" y="947" text-anchor="middle" font-size="12" fill="#1E293B">report.docx</text>

    <rect x="897" y="920" width="215" height="44" rx="8" fill="#F1F5F9" stroke="#1E293B" stroke-width="1.3"/>
    <text x="1004" y="947" text-anchor="middle" font-size="12" fill="#1E293B">report.pptx</text>
  </g>

  <!-- Foundation layer -->
  <text x="650" y="988" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B">▼ foundation layer — used throughout intake, analysis, and report generation</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="150" y="1000" width="320" height="56" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <text x="310" y="1022" text-anchor="middle" font-size="12" font-weight="600" fill="#1E293B">Tool Layer</text>
    <text x="310" y="1038" text-anchor="middle" font-size="9.5" fill="#065F46">parsers · OCR · code exec · web search</text>

    <rect x="490" y="1000" width="320" height="56" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <text x="650" y="1022" text-anchor="middle" font-size="12" font-weight="600" fill="#1E293B">Vector Memory</text>
    <text x="650" y="1038" text-anchor="middle" font-size="9.5" fill="#065F46">Chroma — one collection per data type</text>

    <rect x="830" y="1000" width="320" height="56" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <text x="990" y="1022" text-anchor="middle" font-size="12" font-weight="600" fill="#1E293B">Structured Store</text>
    <text x="990" y="1038" text-anchor="middle" font-size="9.5" fill="#065F46">SQLite — sessions.db · checkpoints.db</text>
  </g>

  <!-- Legend -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#475569">
    <rect x="150" y="1072" width="14" height="14" rx="3" fill="#EEF2FF" stroke="#4F46E5"/>
    <text x="170" y="1083">agent / component</text>
    <rect x="320" y="1072" width="14" height="14" rx="3" fill="#FEF3C7" stroke="#D97706"/>
    <text x="340" y="1083">human checkpoint</text>
    <rect x="480" y="1072" width="14" height="14" rx="3" fill="#ECFDF5" stroke="#059669"/>
    <text x="500" y="1083">data / infra layer</text>
    <rect x="650" y="1072" width="14" height="14" rx="3" fill="none" stroke="#9D174D" stroke-dasharray="3 2"/>
    <text x="670" y="1083" fill="#9D174D">external API call</text>
  </g>
</svg>
