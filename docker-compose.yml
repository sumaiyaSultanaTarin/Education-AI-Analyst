# Runs what's actually built today: the FastAPI backend + Streamlit frontend,
# networked together. No Postgres/standalone Chroma service — the backend's
# session store is still in-memory (see backend/api/session_store.py) and
# Chroma runs embedded (PersistentClient writing to ./data/chroma_db), not as
# a separate server, so there's nothing for those containers to connect to yet.
#
# Before first run: copy .env.example to .env and fill in OPENROUTER_API_KEY.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
