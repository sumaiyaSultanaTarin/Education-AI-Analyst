# Runs what's actually built today: the FastAPI backend + Streamlit frontend,
# networked together. No Postgres/standalone Chroma service — session state
# and HITL checkpoints are SQLite files under ./data/ now (see
# backend/api/session_store.py, backend/api/report_pipeline.py), not a
# networked database, and Chroma runs embedded (PersistentClient writing to
# ./data/chroma_db), not as a separate server — so there's nothing for a
# Postgres/Chroma-server container to connect to yet.
#
# Before first run: copy .env.example to .env and fill in OPENROUTER_API_KEY.
# The ./data volume mount below is what makes the SQLite files (and Chroma's
# on-disk index) persist across `docker compose down`/`up`.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
